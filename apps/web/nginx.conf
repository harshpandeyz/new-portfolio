server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The API accepts 25 MiB files. This adds 1 MiB for multipart boundaries
  # and the small form fields while still rejecting oversized requests here.
  client_max_body_size 26m;
  client_body_timeout 60s;
  error_page 413 = @payload_too_large;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_vary on;
  gzip_min_length 1024;

  # Security headers for the Docker production deployment
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-DNS-Prefetch-Control "off" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https:" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  # Hashed build assets only — immutable for a year. Everything else (favicon,
  # content images, PDFs) is unhashed and must revalidate, otherwise a
  # replaced file would stay stale for clients for a year.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https:" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    try_files $uri =404;
  }

  # Unhashed static content (favicon, case-study images, PDFs): short cache
  # with revalidation so replaced files propagate instead of sticking for a
  # year. Hashed build output lives under /assets/ above.
  location ~* \.(ico|svg|png|jpg|jpeg|webp|avif|pdf)$ {
    expires 7d;
    add_header Cache-Control "public, must-revalidate" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https:" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    try_files $uri =404;
  }

  # Liveness/readiness are for Docker and loopback host operations only.
  location = /api/health { return 404; }
  location = /api/ready { return 404; }

  location ^~ /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Same-origin proxy: the browser already proved its origin by loading this
    # site. The API's origin allow-list cannot include the local development
    # origins (production validation requires public https), so drop the header
    # here instead of failing every local admin request with FORBIDDEN_ORIGIN.
    # CSRF is still enforced end-to-end (double-submit token), and direct
    # access to the API keeps full origin checking. Do not copy this to an
    # edge that serves cross-origin traffic.
    proxy_set_header Origin "";
    # Caddy is the public edge and overwrites these with its validated client
    # address and original HTTPS scheme. Do not append NGINX's Docker address.
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }

  location ^~ /static/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }

  location @payload_too_large {
    default_type application/json;
    return 413 '{"error":"PAYLOAD_TOO_LARGE","message":"Request body exceeds the proxy limit"}';
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https:" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    # $uri/ removed: /projects exists as a physical asset directory
    # (projects/cctv-x/*) but /projects is also an SPA route. With $uri/
    # nginx would 301-redirect /projects → /projects/ instead of serving
    # the SPA. try_files $uri alone still serves real files (/files/*,
    # /projects/cctv-x/* via the regex location, /assets/*) and falls
    # through to the SPA for everything else.
    try_files $uri /index.html;
  }
}
