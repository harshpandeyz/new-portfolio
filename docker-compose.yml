services:
  db:
    image: postgres:16-alpine
    # No platform pin: the same file works on arm64 (Oracle Ampere, Apple
    # Silicon) and amd64 (most CI / Render Docker). The digest above is
    # multi-arch for postgres:16-alpine.
    restart: unless-stopped
    # Maintenance access is host-only. The database is also attached to the
    # private application network; no public interface is published.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: hp_os
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - hp_pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/create-app-roles.sql:/docker-entrypoint-initdb.d/10-create-app-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hp_os"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 2g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      app_net:
        ipv4_address: ${DB_IPV4:-172.30.0.10}

  api:
    image: ${API_IMAGE:-hp-os-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      # Local Compose stacks use COMPOSE_API_APP_URL (public-https placeholder
      # origin) while the dev flow keeps APP_URL on localhost. Production hosts
      # leave COMPOSE_API_APP_URL unset so APP_URL (the real origin) applies.
      APP_URL: ${COMPOSE_API_APP_URL:-${APP_URL:?Set APP_URL to the public HTTPS origin}}
      TRUST_PROXY: ${TRUST_PROXY:-172.30.0.30/32}
      DATABASE_URL: postgresql://hp_app:${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}}@db:5432/hp_os?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      SESSION_SECRET_PREVIOUS: ${SESSION_SECRET_PREVIOUS:-}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      TOTP_ENCRYPTION_KEY_PREVIOUS: ${TOTP_ENCRYPTION_KEY_PREVIOUS:-}
      AI_CONFIG_KEY: ${AI_CONFIG_KEY:-}
      AI_CONFIG_KEY_PREVIOUS: ${AI_CONFIG_KEY_PREVIOUS:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      UPLOAD_DIR: uploads
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      CONTACT_NOTIFY_EMAIL: ${CONTACT_NOTIFY_EMAIL:-}
      REPLY_FROM_NAME: ${REPLY_FROM_NAME:-Harsh Pandey}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - hp_uploads:/app/apps/api/uploads
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    # Host-local maintenance only; public traffic goes through Caddy -> web.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4000}:4000"
    healthcheck:
      # Readiness includes a live DB query. /api/health remains a cheap liveness check.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 1g
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      app_net:
        ipv4_address: ${API_IPV4:-172.30.0.20}

  migrate:
    image: ${API_IMAGE:-hp-os-api:local}
    profiles: ["ops"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://hp_migrator:${POSTGRES_MIGRATOR_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}}@db:5432/hp_os?schema=public
    entrypoint: ["node", "/app/node_modules/.bin/prisma"]
    command: ["migrate", "deploy", "--schema", "/app/apps/api/prisma/schema.prisma"]
    networks:
      app_net: {}

  web:
    image: ${WEB_IMAGE:-hp-os-web:local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:?Set VITE_SITE_URL to the public HTTPS origin before building}
        # Optional bake-ins (empty = same-origin API / no WhatsApp channel).
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_API_PORT: ${VITE_API_PORT:-}
        VITE_WHATSAPP: ${VITE_WHATSAPP:-}
        VITE_WHATSAPP_MESSAGE: ${VITE_WHATSAPP_MESSAGE:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5173}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 256m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      app_net:
        ipv4_address: ${WEB_IPV4:-172.30.0.30}

volumes:
  hp_pgdata:
    name: ${DATABASE_VOLUME_NAME:-${COMPOSE_PROJECT_NAME:-portfolio}_hp_pgdata}
  hp_uploads:
    name: ${UPLOAD_VOLUME_NAME:-${COMPOSE_PROJECT_NAME:-portfolio}_hp_uploads}

networks:
  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${APP_SUBNET:-172.30.0.0/24}
